[package]
name = "ash"
version = "1.1.5"
description = "Ash — a frameless terminal with a built-in AI agent"
authors = ["xn0tdev"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "6"
which = "8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
semver = "1"

[features]
# This feature is used by `tauri build` to expose the generated context to
# downstream crates. Keep it in sync with the standard Tauri v2 template.
custom-protocol = ["tauri/custom-protocol"]
