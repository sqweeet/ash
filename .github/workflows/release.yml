name: Release

# Tag a tested version to publish the Windows installer and the self-update exe.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate release version and notes
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Expected vMAJOR.MINOR.PATCH, got $tag" }
          $version = $Matches[1]
          $wails = Get-Content wails.json -Raw | ConvertFrom-Json
          $package = Get-Content frontend/package.json -Raw | ConvertFrom-Json
          $lock = Get-Content frontend/package-lock.json -Raw | ConvertFrom-Json
          foreach ($value in @($wails.info.productVersion, $package.version, $lock.version, $lock.packages.''.version)) {
            if ($value -ne $version) { throw "Version mismatch: tag $version, metadata $value" }
          }
          if (-not (Test-Path "docs/releases/$tag.md")) { throw "Missing release notes for $tag" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Add NSIS to PATH
        shell: pwsh
        run: '"C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH'

      - name: Install frontend
        run: npm --prefix frontend ci

      - name: Frontend regression checks
        run: npm --prefix frontend test

      - name: Build application and installer
        run: wails build -nsis -nosyncgomod -ldflags "-X ash-wails/internal/app.Version=${{ steps.ver.outputs.version }} -X ash-wails/internal/app.Commit=${{ github.sha }} -X ash-wails/internal/app.BuildChannel=release"

      - name: Go regression checks
        run: go test -count=1 ./...

      - name: Go static checks
        run: go vet ./...

      - name: Stage and verify release assets
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force staging | Out-Null
          $assets = @("build/bin/Ash.exe", "build/bin/Ash-amd64-installer.exe")
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing release asset: $asset" }
            $file = Get-Item $asset
            if ($file.Length -lt 1MB) { throw "Release asset is unexpectedly small: $asset" }
            $productVersion = $file.VersionInfo.ProductVersion
            if ($productVersion -ne $version -and $productVersion -ne "$version.0") {
              throw "Wrong embedded version in ${asset}: $productVersion"
            }
          }
          # Keep Ash.exe's name stable: existing installations use it to update.
          Copy-Item "build/bin/Ash.exe" "staging/Ash.exe"
          Copy-Item "build/bin/Ash-amd64-installer.exe" "staging/Ash-Setup-v$version.exe"
          Get-ChildItem staging -Filter *.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content staging/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem staging | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Ash ${{ github.ref_name }} — Gray
          body_path: docs/releases/${{ github.ref_name }}.md
          make_latest: "true"
          files: |
            staging/Ash-Setup-v*.exe
            staging/Ash.exe
            staging/SHA256SUMS.txt
          fail_on_unmatched_files: true
